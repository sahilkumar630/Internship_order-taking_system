<div class="category-section">

  <div class="category-list">

    @for (category of categories; track category.name) {

      <button class="category-item">

        <div class="category-icon">
          {{ category.icon }}
        </div>

        <span>
          {{ category.name }}
        </span>

      </button>

    }

  </div>

</div>
